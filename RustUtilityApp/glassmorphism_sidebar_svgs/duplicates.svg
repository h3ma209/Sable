<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100" role="img" aria-label="Duplicates glass icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9ecd" stop-opacity=".62"/>
      <stop offset=".48" stop-color="#c73d7a" stop-opacity=".43"/>
      <stop offset="1" stop-color="#ff9ecd" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe4f3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dy="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="5" y="5" width="90" height="90" rx="22"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#tile)" stroke="#ffe8f4" stroke-opacity=".78" stroke-width="1.8"/>
    <g clip-path="url(#clip)">
      <path d="M2 29 Q26 1 59 4 Q82 6 99 25 V5 H5 Z" fill="url(#shine)"/>
      <path d="M7 28 Q32 5 61 9" fill="none" stroke="#ffffff" stroke-opacity=".58" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="83" cy="82" r="28" fill="#ff9ecd" opacity=".13"/>
    </g>
    <rect x="28" y="28" width="17" height="17" rx="3.5" fill="url(#glyph)" stroke="#fff0f8" stroke-width="2"/>
    <rect x="55" y="28" width="17" height="17" rx="3.5" fill="url(#glyph)" stroke="#fff0f8" stroke-width="2"/>
    <rect x="55" y="55" width="17" height="17" rx="3.5" fill="url(#glyph)" stroke="#fff0f8" stroke-width="2"/>
    <rect x="28" y="55" width="17" height="17" rx="3.5" fill="url(#glyph)" stroke="#fff0f8" stroke-width="2"/>
  </g>
</svg>
