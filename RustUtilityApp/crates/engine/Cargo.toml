[package]
name = "engine"
version = "0.3.2"
edition = "2021"
description = "Disk scan and trash plan for Sable"
license = "MIT"
keywords = ["macos", "disk-usage", "cleanup"]
categories = ["os", "filesystem"]

[dependencies]
async-trait = "0.1"
libc = "0.2"
thiserror = "2"
sysinfo = "0.33"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
rayon = "1.12.0"
