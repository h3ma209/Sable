name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: macOS (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch_label: arm64
          - runner: macos-13
            arch_label: x64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustUtilityApp

      - name: Package Sable.app
        working-directory: RustUtilityApp
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZE_PROFILE: ${{ secrets.NOTARIZE_PROFILE }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: make package

      - name: Generate per-arch SHA256
        working-directory: RustUtilityApp/dist
        run: shasum -a 256 Sable-*.dmg Sable-*.zip > "SHA256SUMS-${{ matrix.arch_label }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: sable-${{ matrix.arch_label }}
          path: |
            RustUtilityApp/dist/Sable-*.dmg
            RustUtilityApp/dist/Sable-*.zip
            RustUtilityApp/dist/SHA256SUMS-${{ matrix.arch_label }}.txt

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: sable-*
          merge-multiple: true

      - name: Merge SHA256 checksums
        run: |
          cat artifacts/SHA256SUMS-*.txt | sort -u > artifacts/SHA256SUMS.txt
          echo "Combined checksums:"
          cat artifacts/SHA256SUMS.txt

      - name: Attach installers to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Sable-*.dmg
            artifacts/Sable-*.zip
            artifacts/SHA256SUMS.txt
